[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "web2gtk"
version = "0.2.37"
description = "Lightweight, native GTK4/Libadwaita desktop app generator for Linux web applications without Electron."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Galyarder Labs", email = "muhamadgalihsaputra@users.noreply.github.com" }
]
keywords = ["gtk4", "libadwaita", "webkitgtk", "desktop", "linux", "gnome", "web2app"]
classifiers = [
    "Environment :: X11 Applications :: GTK",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop Environment :: Gnome",
]
requires-python = ">=3.10"
dependencies = [
    "PyGObject>=3.46.0",
    "Pillow>=10.0.0",
    "requests>=2.28.0",
    "beautifulsoup4>=4.12.0",
]

[project.scripts]
web2gtk = "web2gtk.cli:main"
web2gtk-runner = "web2gtk.engine.runner:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["web2gtk*"]
